name: Cloud Portfolio CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  integration:
    name: Build and Integration Tests
    runs-on: ubuntu-latest
    env:
      # Pins the compose project name so test_user.py's subprocess seeding
      # (`docker compose -p m8_13_2_test exec ...`) finds the containers
      # started here. Without this, CI's default project name would differ
      # from the name test_user.py expects, and every auth test would fail
      # on "Failed to seed test user".
      COMPOSE_PROJECT_NAME: m8_13_2_test
      M8_TEST_PROJECT: m8_13_2_test
      # Host-side tests import tests.support.* — PYTHONPATH must include the
      # repo root so `from tests.support.auth_client import ...` resolves when
      # test_auth_http.py is run as a script (python3 tests/... doesn't add
      # CWD to sys.path).
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker compose ps
          exit 1

      - name: Run auth lifecycle tests (host)
        run: python3 tests/test_auth_http.py

      - name: Run HTTP integration tests (host)
        run: |
          python3 -m unittest \
            tests.test_api \
            tests.test_clients \
            tests.test_applications \
            tests.test_dashboard \
            tests.test_monitoring_api \
            tests.test_monitoring_state \
            -v

      - name: Run SSRF acceptance tests (host)
        run: python3 -m unittest tests.test_ssrf -v

      - name: Run worker tests (inside container)
        run: docker compose exec -T api python3 -m unittest tests.test_monitoring_worker tests.test_incidents tests.test_backups tests.test_reporting tests.test_agencies -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
