<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agency Reliability Desk{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <div class="prototype-banner" role="status">
    Development prototype — single agency, no authentication, synthetic data only.
  </div>
  <header class="site-header">
    <a class="brand" href="/dashboard/">Agency Reliability Desk</a>
    <nav>
      <a href="/dashboard/" class="{% if nav == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/dashboard/clients" class="{% if nav == 'clients' %}active{% endif %}">Clients</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Milestone 2 · Local development only · <a href="/docs">API docs</a>
  </footer>
</body>
</html>
